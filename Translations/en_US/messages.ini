; Translation key convention (mautic.c15t.<area>.<field>[.tooltip]) matches
; the rest of Mautic's own bundles (e.g. MessengerBundle's
; mautic.messenger.config.* keys) -- confirmed against that bundle's own
; Translations/en_US/messages.ini, fetched directly from mautic/mautic on
; GitHub, not guessed.
;
; Per-integration ENABLED toggle and PARAM field labels/tooltips each use
; ONE shared compound key (%name% / %integration% + %param% placeholders,
; Form/Type/ConfigType.php substitutes these in) rather than one key per
; integration -- see that file's own comment for why. The values
; substituted in are themselves translated from Service/
; IntegrationRegistry.php's own 'label' entries (mautic.c15t.integration.*
; keys below), so the final rendered text is translated end to end.

mautic.c15t.config.domains = "Allowed domains"
mautic.c15t.config.domains.tooltip = "One domain per line (or comma-separated). Any site on this list may embed and use this Mautic instance's /consent.js loader script; requests from any other origin are refused."

mautic.c15t.config.backend_url = "c15t backend URL"
mautic.c15t.config.backend_url.tooltip = "The base URL of your self-hosted c15t backend, e.g. https://consent.example.com/api/c15t. Required -- the consent runtime cannot start without it."

mautic.c15t.config.categories = "Consent categories"
mautic.c15t.config.categories.tooltip = "Which consent categories are offered to visitors on the banner. \"Necessary\" is always included even if not selected here."

mautic.c15t.config.disable_default_css = "Disable default banner styling"
mautic.c15t.config.disable_default_css.tooltip = "When enabled, the consent banner ships with no default CSS so a site's own stylesheet can style it instead."

mautic.c15t.config.integration_enabled = "Enable %name%"
mautic.c15t.config.integration_enabled.tooltip = "Load %name% once a visitor consents to its category. Requires the field(s) below to be filled in."

mautic.c15t.config.integration_param = "%integration% — %param%"
mautic.c15t.config.integration_param.tooltip = "The %param% for %integration%. Only used if enabled above."

mautic.c15t.config.advanced_scripts_json = "Advanced: custom scripts (JSON)"
mautic.c15t.config.advanced_scripts_json.tooltip = "Optional. A JSON array of raw script-loader entries for anything not covered by the integrations above -- see this plugin's own README.md for the exact shape (raw-src / raw-inline types)."

