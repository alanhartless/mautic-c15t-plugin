mautic.c15t.config.reload_on_restrict = "Reload page on more restrictive consent"
mautic.c15t.config.reload_on_restrict.tooltip = "When a returning visitor changes their preferences to revoke a category they previously allowed (via c15t's onConsentChanged callback), reload the page instead of relying on scripts to tear themselves down. Some third-party scripts (analytics/ad pixels) leave state behind once loaded that can't be cleanly undone in place -- a reload guarantees a clean slate. Off by default since a reload interrupts whatever the visitor was doing."

mautic.c15t.config.initial_ui = "Initial consent UI"
